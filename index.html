document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"542372db-bb22-469e-a895-641cb471ff0c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ---------- BRAND COLORS ---------- */\n\n  /* Primary accent — the brand. Use for logo, primary CTAs, links, accents. */\n  --deltek-marine-blue: #1742F5;   /* primary brand blue */\n\n  /* Deep brand neutrals */\n  --deltek-navy: #070D63;          /* dark hero/background */\n  --rich-black: #00021D;           /* headings on light */\n  --charcoal-grey: #3C454E;        /* body text on light */\n\n  /* Light neutrals */\n  --white: #FFFFFF;\n  --off-white: #FCFDFF;            /* default page background */\n  --light-gray: #EDEFF5;           /* borders / subtle dividers */\n\n  /* ---------- PROJECT LIFECYCLE COLORS (symbolic only) ---------- */\n  /* Each stage has a dark + light endpoint used as a gradient. */\n  --win-teal-dark: #00B6C3;\n  --win-teal-light: #08E9EB;\n  --plan-magenta-dark: #C200CC;\n  --plan-magenta-light: #FF5DF2;\n  --execute-blue-dark: #1742F5;    /* same as marine blue */\n  --execute-blue-light: #3895FF;\n  --analyze-purple-dark: #6D18F1;\n  --analyze-purple-light: #7A62FF;\n\n  /* Canonical lifecycle gradients */\n  --gradient-win: linear-gradient(135deg, var(--win-teal-dark), var(--win-teal-light));\n  --gradient-plan: linear-gradient(135deg, var(--plan-magenta-dark), var(--plan-magenta-light));\n  --gradient-execute: linear-gradient(135deg, var(--execute-blue-dark), var(--execute-blue-light));\n  --gradient-analyze: linear-gradient(135deg, var(--analyze-purple-dark), var(--analyze-purple-light));\n\n  /* Dela (AI orchestrator) brand gradient — spans the lifecycle */\n  --gradient-dela: linear-gradient(90deg, #08E9EB 0%, #FF5DF2 45%, #7A62FF 100%);\n\n  /* Hero/section dividers (straight from brand guidelines) */\n  --gradient-messaging: linear-gradient(135deg, #FF5DF2 0%, #1742F5 50%, #08E9EB 100%);\n  --gradient-visual:    linear-gradient(135deg, #08E9EB 0%, #1742F5 50%, #7A62FF 100%);\n  --gradient-elements:  linear-gradient(135deg, #FF5DF2 0%, #7A62FF 50%, #08E9EB 100%);\n  --gradient-hero:      linear-gradient(135deg, #1742F5 0%, #070D63 100%);\n\n  /* ---------- SEMANTIC FG/BG ---------- */\n  --fg-1: var(--rich-black);       /* primary text */\n  --fg-2: var(--charcoal-grey);    /* secondary/body */\n  --fg-accent: var(--deltek-marine-blue);\n  --fg-on-dark: var(--white);\n  --fg-on-dark-muted: rgba(255,255,255,0.72);\n\n  --bg-1: var(--off-white);        /* page */\n  --bg-2: var(--white);            /* card */\n  --bg-3: var(--light-gray);       /* muted surface */\n  --bg-dark: var(--deltek-navy);\n  --bg-accent: var(--deltek-marine-blue);\n\n  --border: var(--light-gray);\n  --border-strong: #D5DAE6;\n\n  /* ---------- TYPE ---------- */\n  --font-sans: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\n  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;\n\n  /* Weight tokens — Figtree ships 400/500/600/700/800 */\n  --fw-regular: 400;\n  --fw-medium: 500;\n  --fw-semibold: 600;\n  --fw-bold: 700;\n  --fw-extrabold: 800;\n\n  /* Display / heading sizes (screen). Presentations step up; print steps down. */\n  --fs-display: 72px;              /* ExtraBold */\n  --fs-h1: 48px;                   /* Bold */\n  --fs-h2: 32px;                   /* SemiBold */\n  --fs-h3: 24px;                   /* SemiBold */\n  --fs-subhead: 18px;              /* ExtraBold */\n  --fs-body: 16px;                 /* Regular */\n  --fs-small: 14px;\n  --fs-micro: 12px;                /* Labels, legal */\n\n  --lh-tight: 0.95;                /* display */\n  --lh-heading: 1.1;\n  --lh-body: 1.6;\n  --lh-loose: 1.75;\n\n  --tracking-display: -0.02em;     /* compact at display sizes */\n  --tracking-heading: -0.01em;\n  --tracking-label: 0.08em;        /* UPPERCASE eyebrows */\n\n  /* ---------- SPACING (4px base) ---------- */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 80px;\n  --space-10: 120px;\n\n  /* ---------- RADII ---------- */\n  --radius-sm: 4px;       /* inputs, pills */\n  --radius-md: 8px;       /* small cards, buttons */\n  --radius-lg: 12px;      /* default cards */\n  --radius-xl: 16px;      /* feature cards, hero panels */\n  --radius-pill: 999px;\n  --radius-circle: 50%;\n\n  /* ---------- ELEVATION ---------- */\n  /* Deltek's visual style is flat-with-borders; shadows are subtle/rare. */\n  --shadow-xs: 0 1px 2px rgba(0, 2, 29, 0.04);\n  --shadow-sm: 0 2px 8px rgba(0, 2, 29, 0.06);\n  --shadow-md: 0 8px 24px rgba(0, 2, 29, 0.08);\n  --shadow-lg: 0 24px 48px rgba(7, 13, 99, 0.18);\n  --shadow-focus: 0 0 0 3px rgba(23, 66, 245, 0.24);\n\n  /* ---------- MOTION ---------- */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);\n  --dur-fast: 120ms;\n  --dur-base: 200ms;\n  --dur-slow: 320ms;\n\n  /* ---------- LAYOUT ---------- */\n  --max-content: 1280px;\n  --max-text: 720px;\n}\n\n/* ============================================================\n   SEMANTIC ELEMENT DEFAULTS\n   ============================================================ */\n\nhtml { font-family: var(--font-sans); color: var(--fg-1); background: var(--bg-1); }\nbody { font-family: var(--font-sans); font-size: var(--fs-body); line-height: var(--lh-body); color: var(--fg-2); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }\n\n.display, .t-display {\n  font-family: var(--font-sans);\n  font-size: var(--fs-display);\n  font-weight: var(--fw-extrabold);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--tracking-display);\n  color: var(--fg-1);\n}\n\nh1, .t-h1 {\n  font-size: var(--fs-h1);\n  font-weight: var(--fw-bold);\n  line-height: var(--lh-heading);\n  letter-spacing: var(--tracking-heading);\n  color: var(--fg-1);\n}\n\nh2, .t-h2 {\n  font-size: var(--fs-h2);\n  font-weight: var(--fw-semibold);\n  line-height: 1.2;\n  color: var(--fg-1);\n}\n\nh3, .t-h3 {\n  font-size: var(--fs-h3);\n  font-weight: var(--fw-semibold);\n  line-height: 1.25;\n  color: var(--fg-1);\n}\n\n.subhead, .t-subhead {\n  font-size: var(--fs-subhead);\n  font-weight: var(--fw-extrabold);\n  line-height: 1.3;\n  color: var(--fg-1);\n}\n\np, .t-body {\n  font-size: var(--fs-body);\n  font-weight: var(--fw-regular);\n  line-height: var(--lh-body);\n  color: var(--fg-2);\n}\n\n.t-small { font-size: var(--fs-small); }\n\n/* The eyebrow/label pattern used throughout Deltek marketing */\n.t-eyebrow, .label {\n  font-size: var(--fs-micro);\n  font-weight: var(--fw-bold);\n  color: var(--fg-accent);\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-label);\n}\n\ncode, pre, .t-mono {\n  font-family: var(--font-mono);\n  font-size: 13px;\n}\n\na { color: var(--fg-accent); text-decoration: none; }\na:hover { text-decoration: underline; text-underline-offset: 3px; }\n\n/* Focus ring — accessibility */\n:where(a, button, input, textarea, select):focus-visible {\n  outline: none;\n  box-shadow: var(--shadow-focus);\n  border-radius: var(--radius-sm);\n}\n<\u002Fstyle>\n<script src=\"ef34554e-17c6-4efa-83e2-7bf097e19446\"><\u002Fscript>\n<style>\n@media print { .no-print { display: none !important; } }\nbody { margin:0; background: var(--off-white); }\ninput[type=\"date\"]::-webkit-calendar-picker-indicator { opacity:0.5; cursor:pointer; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"max- eName }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fsc-for>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ group.expanded }}\" hint-placeholder-val=\"{{ true }}\">\n              <sc-for list=\"{{ group.phaseRows }}\" as=\"row\" hint-placeholder-count=\"6\">\n                <div style=\"display:flex;height:44px;border-top:1px solid var(--border);\">\n                  <div style=\"width:170px;min-width:170px;max-width:170px;box-sizing:border-box;flex-shrink:0;position:sticky;left:0;background:var(--white);border-right:1px solid var(--border);z-index:3;display:flex;align-items:center;padding:0 14px 0 22px;font-size:12px;color:var(--fg-2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;\">{{ row.phaseName }}<\u002Fdiv>\n                  <div style=\"width:{{ chart.totalWidth }}px;flex-shrink:0;position:relative;\">\n                    <sc-for list=\"{{ chart.weekendRects }}\" as=\"wr\" hint-placeholder-count=\"4\">\n                      <div style=\"position:absolute;top:0;bottom:0;left:{{ wr.x }}px;width:{{ wr.width }}px;background:var(--bg-3);opacity:0.5;\"><\u002Fdiv>\n                    <\u002Fsc-for>\n                    <sc-if value=\"{{ chart.showTodayLine }}\">\n                      <div style=\"position:absolute;top:0;bottom:0;left:{{ chart.todayX }}px;width:2px;background:#B3261E;z-index:2;\"><\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ row.isMilestone }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div title=\"{{ row.tooltip }}\" sc-camel-on-mouse-down=\"{{ row.onDragMove }}\" style=\"position:absolute;top:10px;left:{{ row.diamondX }}px;width:24px;height:24px;background:{{ row.color }};transform:rotate(45deg);border-radius:3px;cursor:grab;box-shadow:var(--shadow-sm);z-index:3;\"><\u002Fdiv>\n                      <div style=\"position:absolute;top:12px;left:{{ row.diamondLabelX }}px;font-size:12px;font-weight:var(--fw-semibold);color:var(--fg-1);white-space:nowrap;z-index:3;\">{{ row.dateLabel }}<\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ row.isBar }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div title=\"{{ row.tooltip }}\" style=\"position:absolute;top:10px;left:{{ row.x }}px;width:{{ row.width }}px;height:24px;background:{{ row.color }};border-radius:6px;display:flex;align-items:center;box-shadow:var(--shadow-sm);z-index:3;\">\n                        <div sc-camel-on-mouse-down=\"{{ row.onDragStart }}\" style=\"width:8px;height:100%;cursor:ew-resize;flex-shrink:0;\"><\u002Fdiv>\n                        <div sc-camel-on-mouse-down=\"{{ row.onDragMove }}\" style=\"flex:1;height:100%;cursor:grab;display:flex;align-items:center;justify-content:center;overflow:hidden;\">\n                          <sc-if value=\"{{ row.showLabel }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:var(--white);font-size:11px;font-weight:var(--fw-semibold);white-space:nowrap;\">{{ row.durationLabel }}<\u002Fspan><\u002Fsc-if>\n                        <\u002Fdiv>\n                        <div sc-camel-on-mouse-down=\"{{ row.onDragEnd }}\" style=\"width:8px;height:100%;cursor:ew-resize;flex-shrink:0;\"><\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fsc-if>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst DAY_W = { day: 44, week: 16, month: 6 };\nconst PAD_DAYS = { day: 3, week: 5, month: 10 };\nconst PALETTE = ['#1742F5', '#C2660A', '#0E9F6E', '#A23B72', '#3D5A80', '#946200', '#5B4B8A'];\nconst LABEL_COL_W = 170;\n\nfunction pad2(n) { return n < 10 ? '0' + n : String(n); }\nfunction parseDate(s) { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }\nfunction fmtDateStr(d) { return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()); }\nfunction addDays(d, n) { return new Date(d.getTime() + n * 86400000); }\nfunction diffDays(a, b) { return Math.round((b.getTime() - a.getTime()) / 86400000); }\nfunction fmtShort(d) { return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' }); }\nfunction fmtWeekdayLetter(d) { return d.toLocaleDateString('en-US', { weekday: 'short', timeZone: 'UTC' }).slice(0, 3); }\nfunction fmtMonthName(d) { return d.toLocaleDateString('en-US', { month: 'long', timeZone: 'UTC' }); }\nfunction isWeekend(d) { const wd = d.getUTCDay(); return wd === 0 || wd === 6; }\nfunction shadeHex(hex, percent) {\n  const num = parseInt(hex.slice(1), 16);\n  let r = (num >> 16) + Math.round(2.55 * percent);\n  let g = ((num >> 8) & 0xFF) + Math.round(2.55 * percent);\n  let b = (num & 0xFF) + Math.round(2.55 * percent);\n  r = Math.min(255, Math.max(0, r)); g = Math.min(255, Math.max(0, g)); b = Math.min(255, Math.max(0, b));\n  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);\n}\nfunction hexToRgba(hex, alpha) {\n  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);\n  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';\n}\nfunction reorder(arr, from, to) {\n  const copy = arr.slice();\n  const [item] = copy.splice(from, 1);\n  copy.splice(to, 0, item);\n  return copy;\n}\n\nclass Component extends DCLogic {\n  state = {\n    zoom: 'day',\n    dragging: null,\n    collapsed: { computerease: true, vantagepoint: true, costpoint: true },\n    hideWeekends: false,\n    exportFrom: '',\n    exportTo: '',\n    phases: [\n      { id: 'analysis', name: 'Analysis' },\n      { id: 'development', name: 'Development' },\n      { id: 'ops', name: 'Ops Testing' },\n      { id: 'sme', name: 'SME Testing' },\n      { id: 'calibration', name: 'Calibration' },\n      { id: 'launch', name: 'Launch' }\n    ],\n    products: [\n      { id: 'computerease', name: 'ComputerEase', color: '#1742F5', phases: {\n        analysis: null,\n        development: { start: '2026-08-31', end: '2026-09-04' },\n        ops: { start: '2026-09-07', end: '2026-09-08' },\n        sme: { start: '2026-09-09', end: '2026-09-11' },\n        calibration: { start: '2026-09-14', end: '2026-09-17' },\n        launch: { start: '2026-09-18', end: '2026-09-18' }\n      }},\n      { id: 'vantagepoint', name: 'Vantagepoint', color: '#C2660A', phases: {\n        analysis: { start: '2026-09-03', end: '2026-09-04' },\n        development: { start: '2026-09-07', end: '2026-09-11' },\n        ops: { start: '2026-09-14', end: '2026-09-15' },\n        sme: { start: '2026-09-16', end: '2026-09-18' },\n        calibration: { start: '2026-09-21', end: '2026-10-01' },\n        launch: { start: '2026-10-02', end: '2026-10-02' }\n      }},\n      { id: 'costpoint', name: 'Costpoint', color: '#0E9F6E', phases: {\n        analysis: { start: '2026-09-07', end: '2026-09-09' },\n        development: { start: '2026-09-14', end: '2026-09-18' },\n        ops: { start: '2026-09-21', end: '2026-09-22' },\n        sme: { start: '2026-09-23', end: '2026-09-25' },\n        calibration: { start: '2026-10-12', end: '2026-10-15' },\n        launch: { start: '2026-10-16', end: '2026-10-16' }\n      }}\n    ]\n  };\n\n  setCellField(productId, phaseId, field, value) {\n    this.setState(s => ({ products: s.products.map(p => p.id !== productId ? p : {\n      ...p, phases: { ...p.phases, [phaseId]: { ...(p.phases[phaseId] || { start: '', end: '' }), [field]: value } }\n    }) }));\n  }\n  setCellBoth(productId, phaseId, start, end) {\n    this.setState(s => ({ products: s.products.map(p => p.id !== productId ? p : {\n      ...p, phases: { ...p.phases, [phaseId]: { start, end } }\n    }) }));\n  }\n  updateProductName(id, name) { this.setState(s => ({ products: s.products.map(p => p.id === id ? { ...p, name } : p) })); }\n  updateProductColor(id, color) { this.setState(s => ({ products: s.products.map(p => p.id === id ? { ...p, color } : p) })); }\n  setExportFrom(v) { this.setState({ exportFrom: v }); }\n  setExportTo(v) { this.setState({ exportTo: v }); }\n  updatePhaseName(id, name) { this.setState(s => ({ phases: s.phases.map(ph => ph.id === id ? { ...ph, name } : ph) })); }\n  removeProduct(id) { this.setState(s => ({ products: s.products.filter(p => p.id !== id) })); }\n  removePhase(id) {\n    this.setState(s => ({\n      phases: s.phases.filter(ph => ph.id !== id),\n      products: s.products.map(p => { const np = { ...p.phases }; delete np[id]; return { ...p, phases: np }; })\n    }));\n  }\n  addPhase() {\n    this.setState(s => {\n      const id = 'phase_' + Date.now();\n      return { phases: [...s.phases, { id, name: 'New Phase' }], products: s.products.map(p => ({ ...p, phases: { ...p.phases, [id]: null } })) };\n    });\n  }\n  addProduct() {\n    this.setState(s => {\n      const id = 'prod_' + Date.now();\n      const color = PALETTE[s.products.length % PALETTE.length];\n      const phasesObj = {};\n      s.phases.forEach(ph => phasesObj[ph.id] = null);\n      return { products: [...s.products, { id, name: 'New Product', color, phases: phasesObj }] };\n    });\n  }\n  setZoom(z) { this.setState({ zoom: z }); }\n  toggleWeekends() { this.setState(s => ({ hideWeekends: !s.hideWeekends })); }\n  toggleCollapse(productId) { this.setState(s => ({ collapsed: { ...s.collapsed, [productId]: !s.collapsed[productId] } })); }\n  collapseAll() { this.setState(s => { const c = {}; s.products.forEach(p => c[p.id] = true); return { collapsed: c }; }); }\n  expandAll() { this.setState({ collapsed: {} }); }\n  moveProduct(from, to) { this.setState(s => ({ products: reorder(s.products, from, to) })); }\n  movePhase(from, to) { this.setState(s => ({ phases: reorder(s.phases, from, to) })); }\n\n  onProductDragStart(idx) { return (e) => { this._dragProductIdx = idx; e.dataTransfer.effectAllowed = 'move'; }; }\n  onProductDragOver() { return (e) => { e.preventDefault(); }; }\n  onProductDrop(idx) { return (e) => { e.preventDefault(); if (this._dragProductIdx != null && this._dragProductIdx !== idx) this.moveProduct(this._dragProductIdx, idx); this._dragProductIdx = null; }; }\n  onPhaseDragStart(idx) { return (e) => { this._dragPhaseIdx = idx; e.dataTransfer.effectAllowed = 'move'; }; }\n  onPhaseDragOver() { return (e) => { e.preventDefault(); }; }\n  onPhaseDrop(idx) { return (e) => { e.preventDefault(); if (this._dragPhaseIdx != null && this._dragPhaseIdx !== idx) this.movePhase(this._dragPhaseIdx, idx); this._dragPhaseIdx = null; }; }\n\n  makeDragHandler(productId, phaseId, mode) {\n    return (e) => {\n      e.preventDefault(); e.stopPropagation();\n      const p = this.state.products.find(x => x.id === productId);\n      const c = p && p.phases[phaseId];\n      if (!c || !c.start || !c.end) return;\n      this.setState({ dragging: { productId, phaseId, mode, startX: e.clientX, origStart: c.start, origEnd: c.end } });\n    };\n  }\n\n  componentDidMount() {\n    this._onMove = (e) => {\n      const d = this.state.dragging;\n      if (!d) return;\n      const dayW = DAY_W[this.state.zoom];\n      const deltaDays = Math.round((e.clientX - d.startX) / dayW);\n      const os = parseDate(d.origStart), oe = parseDate(d.origEnd);\n      let ns = os, ne = oe;\n      if (d.mode === 'move') { ns = addDays(os, deltaDays); ne = addDays(oe, deltaDays); }\n      else if (d.mode === 'start') { ns = addDays(os, deltaDays); if (ns.getTime() > oe.getTime()) ns = oe; ne = oe; }\n      else { ne = addDays(oe, deltaDays); if (ne.getTime() < os.getTime()) ne = os; ns = os; }\n      this.setCellBoth(d.productId, d.phaseId, fmtDateStr(ns), fmtDateStr(ne));\n    };\n    this._onUp = () => { if (this.state.dragging) this.setState({ dragging: null }); };\n    window.addEventListener('mousemove', this._onMove);\n    window.addEventListener('mouseup', this._onUp);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('mousemove', this._onMove);\n    window.removeEventListener('mouseup', this._onUp);\n  }\n\n  setChartRef = (el) => {\n    this.chartEl = el;\n    if (el && !el._synced) {\n      el._synced = true;\n      el.addEventListener('scroll', () => {\n        if (this._syncing || !this.topScrollEl) return;\n        this._syncing = true; this.topScrollEl.scrollLeft = el.scrollLeft; this._syncing = false;\n      });\n    }\n  };\n  setTopScrollRef = (el) => {\n    this.topScrollEl = el;\n    if (el && !el._synced) {\n      el._synced = true;\n      el.addEventListener('scroll', () => {\n        if (this._syncing || !this.chartEl) return;\n        this._syncing = true; this.chartEl.scrollLeft = el.scrollLeft; this._syncing = false;\n      });\n    }\n  };\n  setChartOuterRef = (el) => { this.chartOuterEl = el; };\n  printView = () => { window.print(); };\n  exportPNG = async () => {\n    if (!window.html2canvas || !this.chartOuterEl) return;\n    const scrollDiv = this.chartEl;\n    const prevOverflow = scrollDiv.style.overflow;\n    scrollDiv.style.overflow = 'visible';\n    try {\n      const canvas = await window.html2canvas(this.chartOuterEl, { scale: 2, backgroundColor: '#FFFFFF' });\n      const link = document.createElement('a');\n      link.download = 'dsa-launch-schedule.png';\n      link.href = canvas.toDataURL('image/png');\n      link.click();\n    } finally { scrollDiv.style.overflow = prevOverflow; }\n  };\n\n  buildComputed() {\n    const { phases, products, zoom, collapsed, hideWeekends } = this.state;\n    const dayW = DAY_W[zoom];\n    let allDates = [];\n    products.forEach(p => phases.forEach(ph => { const c = p.phases[ph.id]; if (c && c.start && c.end) { allDates.push(parseDate(c.start).getTime(), parseDate(c.end).getTime()); } }));\n    const now = new Date();\n    const today = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));\n    let minD, maxD;\n    if (allDates.length) { minD = new Date(Math.min(...allDates)); maxD = new Date(Math.max(...allDates)); }\n    else { minD = today; maxD = addDays(today, 21); }\n    const pad = PAD_DAYS[zoom];\n    minD = addDays(minD, -pad); maxD = addDays(maxD, pad);\n    const numDays = diffDays(minD, maxD) + 1;\n\n    // slot[i] = pixel-column index for day offset i, collapsing weekends when hidden\n    const slot = [];\n    let slotCount = 0;\n    for (let i = 0; i < numDays; i++) {\n      const d = addDays(minD, i);\n      if (hideWeekends && isWeekend(d)) { slot[i] = slotCount; }\n      else { slot[i] = slotCount; slotCount++; }\n    }\n    const totalWidth = slotCount * dayW;\n    const xOf = (i) => slot[i] * dayW;\n\n    const weekendRects = [];\n    if (!hideWeekends) {\n      for (let i = 0; i < numDays; i++) { const d = addDays(minD, i); if (isWeekend(d)) weekendRects.push({ x: xOf(i), width: dayW }); }\n    }\n\n    const ticks = [];\n    if (zoom === 'day') {\n      for (let i = 0; i < numDays; i++) {\n        const d = addDays(minD, i);\n        if (hideWeekends && isWeekend(d)) continue;\n        ticks.push({ x: xOf(i), width: dayW, label: String(d.getUTCDate()), sub: fmtWeekdayLetter(d) });\n      }\n    } else if (zoom === 'week') {\n      let i = 0;\n      while (i < numDays) {\n        const d = addDays(minD, i); const dow = d.getUTCDay();\n        const daysUntilNextMonday = dow === 1 ? 7 : (((8 - dow) % 7) || 7);\n        const span = Math.min(daysUntilNextMonday, numDays - i);\n        const w = hideWeekends ? (slot[Math.min(i + span - 1, numDays - 1)] - slot[i] + 1) * dayW : span * dayW;\n        ticks.push({ x: xOf(i), width: Math.max(w, dayW), label: fmtShort(d), sub: null });\n        i += span;\n      }\n    } else {\n      let i = 0;\n      while (i < numDays) {\n        const d = addDays(minD, i); const month = d.getUTCMonth();\n        let span = 0;\n        while (i + span < numDays && addDays(minD, i + span).getUTCMonth() === month) span++;\n        const w = hideWeekends ? (slot[Math.min(i + span - 1, numDays - 1)] - slot[i] + 1) * dayW : span * dayW;\n        ticks.push({ x: xOf(i), width: Math.max(w, dayW), label: fmtMonthName(d), sub: null });\n        i += span;\n      }\n    }\n\n    const todayIdx = diffDays(minD, today);\n    const showTodayLine = todayIdx >= 0 && todayIdx < numDays && !(hideWeekends && isWeekend(today));\n    const todayX = showTodayLine ? xOf(todayIdx) + dayW / 2 : 0;\n\n    const groups = products.map((p, pIdx) => ({\n      productId: p.id, name: p.name, color: p.color, tint: hexToRgba(p.color, 0.06), tintSolid: shadeHex(p.color, 92),\n      expanded: !collapsed[p.id],\n      collapsed: !!collapsed[p.id],\n      chevronRotate: collapsed[p.id] ? 'rotate(0deg)' : 'rotate(90deg)',\n      onToggleCollapse: () => this.toggleCollapse(p.id),\n      phaseRows: phases.map((ph, phIdx) => {\n        const c = p.phases[ph.id];\n        const shadePercent = phases.length > 1 ? -28 + (phIdx / (phases.length - 1)) * 46 : 0;\n        const row = {\n          phaseId: ph.id, phaseName: ph.name, isMilestone: false, isBar: false,\n          x: 0, width: 0, diamondX: 0, diamondLabelX: 0, dateLabel: '', tooltip: '', color: p.color, summaryColor: shadeHex(p.color, shadePercent), showLabel: false, durationLabel: '',\n          onDragStart: this.makeDragHandler(p.id, ph.id, 'start'),\n          onDragMove: this.makeDragHandler(p.id, ph.id, 'move'),\n          onDragEnd: this.makeDragHandler(p.id, ph.id, 'end')\n        };\n        if (c && c.start && c.end) {\n          const s = parseDate(c.start), e = parseDate(c.end);\n          const sIdx = diffDays(minD, s), eIdx = diffDays(minD, e);\n          if (c.start === c.end) {\n            row.isMilestone = true;\n            row.diamondX = xOf(sIdx) + dayW / 2 - 12;\n            row.diamondLabelX = xOf(sIdx) + dayW / 2 + 16;\n            row.dateLabel = fmtShort(s);\n            row.tooltip = ph.name + ' \\u00b7 ' + fmtShort(s);\n          } else {\n            row.isBar = true;\n            row.x = xOf(sIdx) + 2;\n            row.width = Math.max((slot[eIdx] - slot[sIdx] + 1) * dayW - 4, dayW - 4);\n            row.durationLabel = (eIdx - sIdx + 1) + 'd';\n            row.showLabel = row.width > 34;\n            row.tooltip = ph.name + ' \\u00b7 ' + fmtShort(s) + ' \\u2013 ' + fmtShort(e);\n          }\n        }\n        return row;\n      })\n    }));\n\n    const tableProducts = products.map((p, idx) => ({\n      id: p.id, name: p.name, color: p.color,\n      onNameChange: (e) => this.updateProductName(p.id, e.target.value),\n      onColorChange: (e) => this.updateProductColor(p.id, e.target.value),\n      onRemove: () => this.removeProduct(p.id),\n      onDragStart: this.onProductDragStart(idx),\n      onDragOver: this.onProductDragOver(idx),\n      onDrop: this.onProductDrop(idx),\n      cells: phases.map(ph => {\n        const c = p.phases[ph.id];\n        const empty = !c || !c.start || !c.end;\n        return {\n          phaseId: ph.id, start: c && c.start ? c.start : '', end: c && c.end ? c.end : '',\n          onChangeStart: (e) => this.setCellField(p.id, ph.id, 'start', e.target.value),\n          onChangeEnd: (e) => this.setCellField(p.id, ph.id, 'end', e.target.value),\n          bg: empty ? 'var(--bg-1)' : 'var(--white)',\n          borderStyle: empty ? 'dashed' : 'solid',\n          borderColor: empty ? 'var(--border-strong)' : 'var(--border)'\n        };\n      })\n    }));\n\n    const phasesVals = phases.map((ph, idx) => ({\n      id: ph.id, name: ph.name,\n      onNameChange: (e) => this.updatePhaseName(ph.id, e.target.value),\n      onRemove: () => this.removePhase(ph.id),\n      onDragStart: this.onPhaseDragStart(idx),\n      onDragOver: this.onPhaseDragOver(idx),\n      onDrop: this.onPhaseDrop(idx)\n    }));\n\n    const zoomOptions = ['day', 'week', 'month'].map(z => ({\n      key: z, label: z[0].toUpperCase() + z.slice(1),\n      onClick: () => this.setZoom(z),\n      style: z === zoom\n        ? 'padding:8px 16px;border-radius:6px;border:none;background:var(--deltek-marine-blue);color:var(--white);font-weight:600;font-size:13px;cursor:pointer;'\n        : 'padding:8px 16px;border-radius:6px;border:none;background:transparent;color:var(--fg-2);font-weight:600;font-size:13px;cursor:pointer;'\n    }));\n\n    const colW = 150;\n    const tableGridCols = '220px repeat(' + phases.length + ', ' + colW + 'px) 48px';\n    const tableMinWidth = 220 + phases.length * colW + 48;\n    const contentWidth = LABEL_COL_W + totalWidth;\n\n    this._chartGeo = { minD, maxD, numDays, dayW, xOf, outerWidth: LABEL_COL_W + totalWidth };\n    const weekendToggleLabel = hideWeekends ? 'Show weekends' : 'Hide weekends';\n    const weekendToggleStyle = 'padding:8px 14px;border-radius:var(--radius-md);border:1px solid var(--border-strong);background:' + (hideWeekends ? 'rgba(23,66,245,0.06)' : 'var(--white)') + ';color:' + (hideWeekends ? 'var(--deltek-marine-blue)' : 'var(--fg-1)') + ';font-weight:var(--fw-semibold);font-size:var(--fs-small);cursor:pointer;';\n\n    return { chart: { totalWidth, contentWidth, ticks, weekendRects, showTodayLine, todayX, groups }, tableProducts, phasesVals, zoomOptions, tableGridCols, tableMinWidth, weekendToggleLabel, weekendToggleStyle };\n  }\n\n  renderVals() {\n    const c = this.buildComputed();\n    return {\n      phases: c.phasesVals,\n      products: c.tableProducts,\n      tableGridCols: c.tableGridCols,\n      tableMinWidth: c.tableMinWidth,\n      zoomOptions: c.zoomOptions,\n      chart: c.chart,\n      addPhase: this.addPhase.bind(this),\n      addProduct: this.addProduct.bind(this),\n      toggleWeekends: this.toggleWeekends.bind(this),\n      weekendToggleLabel: c.weekendToggleLabel,\n      weekendToggleStyle: c.weekendToggleStyle,\n      collapseAll: this.collapseAll.bind(this),\n      expandAll: this.expandAll.bind(this),\n      exportPNG: this.exportPNG,\n      printView: this.printView,\n      setChartRef: this.setChartRef,\n      setChartOuterRef: this.setChartOuterRef,\n      setTopScrollRef: this.setTopScrollRef\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
